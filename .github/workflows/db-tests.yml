name: Database tests (tenant isolation = release blocker)

on:
  push:
    paths: ["platform/supabase/**", ".github/workflows/db-tests.yml"]
  pull_request:
    paths: ["platform/supabase/**", ".github/workflows/db-tests.yml"]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17      # production Supabase runs Postgres 17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run migrations + tests (upgrade and fresh scenarios)
        run: bash platform/supabase/tests/run.sh
