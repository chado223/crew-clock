name: Staging database (apply migrations + run tests)

# Targets ONLY the crew-clock-staging Supabase project via the STAGING_DB_URL
# secret. There is no production credential in this repository.

on:
  push:
    branches: [main, "phase-*"]
    paths: ["platform/supabase/**", ".github/workflows/staging-db.yml"]
  workflow_dispatch:

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - name: Check secret
        id: secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "STAGING_DB_URL secret not set; skipping."; echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secret.outputs.present == 'true'
      - name: Install psql 17
        if: steps.secret.outputs.present == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Guard against production
        if: steps.secret.outputs.present == 'true'
        run: |
          case "$DB_URL" in
            *iwowjrnrbjiydckhjsfi*) echo "::error::STAGING_DB_URL points at PRODUCTION. Refusing."; exit 1;;
            *newivmnolbzhjypusmob*) echo "Target: crew-clock-staging";;
            *) echo "::error::STAGING_DB_URL is not the crew-clock-staging project. Refusing."; exit 1;;
          esac
      - name: Apply migrations to staging
        if: steps.secret.outputs.present == 'true'
        run: bash platform/supabase/scripts/apply_migrations.sh
      - name: Run full test suite on staging (each file rolled back)
        if: steps.secret.outputs.present == 'true'
        run: bash platform/supabase/tests/run_remote.sh
