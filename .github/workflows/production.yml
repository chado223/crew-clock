name: Production (approval required)

# Runs ONLY against crew-clock-prod, ONLY from the `production-ops` branch, and
# ONLY after Chad approves the run (GitHub Environment "production" with a
# required reviewer holds the database connection secret). The action comes
# from .github/production/request.txt. It never touches the old shared project
# or staging, and never sends messages.

on:
  push:
    branches: [production-ops]
    paths: [".github/production/request.txt"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Read requested action
        id: req
        run: |
          action="$(grep -E '^action=' .github/production/request.txt | tail -1 | cut -d= -f2 | tr -d '[:space:]')"
          case "$action" in check|migrate|preflight|auth-settings|auth-send|auth-verify|auth-config) ;; *) echo "::error::unknown action '$action'"; exit 1;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "::notice title=production::requested action: $action"
      - name: Install psql 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Guard (must be crew-clock-prod)
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: bash .github/scripts/require-production.sh
      - name: State
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          psql "$DB_URL" -X -At -c "select 'public tables: ' || count(*) from pg_tables where schemaname = 'public'
            union all select 'migrations recorded: ' || coalesce((select count(*)::text from supabase_migrations.schema_migrations), '0')
            union all select 'companies: ' || coalesce((select count(*)::text from public.tenants), 'n/a')" 2>/dev/null \
            | sed 's/^/::notice title=state::/' || echo "::notice title=state::empty project"
      - name: Apply migrations and mark as production
        if: steps.req.outputs.action == 'migrate'
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          bash platform/supabase/scripts/apply_migrations.sh
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "update private.platform_flags set enabled = true, updated_at = now() where key = 'production'"
          psql "$DB_URL" -X -At -c "select key || '=' || enabled from private.platform_flags order by key" | sed 's/^/::notice title=flags::/'
      - name: Preflight (read-only)
        if: steps.req.outputs.action == 'preflight' || steps.req.outputs.action == 'migrate'
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          latest="$(ls platform/supabase/migrations/*.sql | sort | tail -1 | xargs basename | cut -d_ -f1)"
          psql "$DB_URL" -X -At -F ' | ' -v expected_latest="$latest" -f platform/supabase/ops/preflight.sql > preflight.txt
          sed 's/^t | /::notice title=pass::/; s/^f | /::warning title=not yet::/' preflight.txt

      # ---- Sign-in (auth) checks. Only ever the owner's own address; never anyone else.
      - name: Sign-in settings (read-only, public endpoint)
        if: startsWith(steps.req.outputs.action, 'auth-')
        env:
          URL: https://kymnehbnmqvpzwtxtizm.supabase.co
          KEY: sb_publishable_dPalDCiHQ0C1TaUbmxeFEw_3yq5K7St
        run: |
          curl -fsS "$URL/auth/v1/settings" -H "apikey: $KEY" > settings.json
          jq -r '"email sign-in enabled: \(.external.email)", "sign-ups open: \(.disable_signup|not)", "email auto-confirm (should be false): \(.mailer_autoconfirm)", "phone sign-in: \(.external.phone)", "anonymous sign-in: \(.external.anonymous_users // false)"' settings.json | sed 's/^/::notice title=auth::/'
      - name: Send one sign-in code to the owner only
        if: steps.req.outputs.action == 'auth-send'
        env:
          URL: https://kymnehbnmqvpzwtxtizm.supabase.co
          KEY: sb_publishable_dPalDCiHQ0C1TaUbmxeFEw_3yq5K7St
          TO: chadwasham64@gmail.com
        run: |
          [ "$TO" = "chadwasham64@gmail.com" ] || { echo "::error::only the owner's address is allowed"; exit 1; }
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$URL/auth/v1/otp" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$TO\",\"create_user\":true}")
          [ "$code" = "200" ] || { echo "::error title=auth::code request failed ($code): $(head -c 300 resp.json)"; exit 1; }
          echo "::notice title=auth::one sign-in code requested for $TO (expires in 1 hour)"
      - name: Verify the code, check the session, then sign the test session out
        if: steps.req.outputs.action == 'auth-verify'
        env:
          URL: https://kymnehbnmqvpzwtxtizm.supabase.co
          KEY: sb_publishable_dPalDCiHQ0C1TaUbmxeFEw_3yq5K7St
          TO: chadwasham64@gmail.com
          OTP: ${{ secrets.OTP_CODE }}
        run: |
          [ -n "$OTP" ] || { echo "::error::add the OTP_CODE secret to the production environment first"; exit 1; }
          code=$(curl -sS -o session.json -w '%{http_code}' -X POST "$URL/auth/v1/verify" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"type\":\"email\",\"email\":\"$TO\",\"token\":\"$OTP\"}")
          [ "$code" = "200" ] || { echo "::error title=auth::code was not accepted ($code): $(jq -r '.msg // .error_description // .error // empty' session.json | head -c 200)"; exit 1; }
          # Never print tokens; only facts about the session.
          jq -r '"signed in as: \(.user.email)", "user id: \(.user.id)", "email confirmed: \(.user.email_confirmed_at != null)", "role: \(.user.role)", "session lasts: \(.expires_in) seconds", "has refresh token: \(.refresh_token != null)"' session.json | sed 's/^/::notice title=session::/'
          [ "$(jq -r .user.email session.json)" = "$TO" ] || { echo "::error::session is for the wrong address"; exit 1; }
          # Prove the session works against the database as this user, then end it.
          token=$(jq -r .access_token session.json)
          curl -fsS "$URL/rest/v1/rpc/my_companies" -X POST -H "apikey: $KEY" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{}' \
            | jq -r '"companies visible to this sign-in: \(length)"' | sed 's/^/::notice title=session::/'
          curl -fsS -o /dev/null -X POST "$URL/auth/v1/logout?scope=global" -H "apikey: $KEY" -H "Authorization: Bearer $token"
          echo "::notice title=session::test session signed out everywhere"
          rm -f session.json
      - name: Read the live sign-in configuration (read-only Management API; prints no secrets)
        if: steps.req.outputs.action == 'auth-config'
        env:
          REF: kymnehbnmqvpzwtxtizm
          SBP: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SBP" ] || { echo "::error::add the SUPABASE_ACCESS_TOKEN secret to the production environment first"; exit 1; }
          code=$(curl -sS -o cfg.json -w '%{http_code}' "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $SBP")
          [ "$code" = "200" ] || { echo "::error title=auth-config::Management API returned $code"; rm -f cfg.json; exit 1; }
          jq -r '
            "site URL: \(.site_url)",
            "allowed redirect URLs: \((.uri_allow_list // "") | if . == "" then "none" else . end)",
            "email sign-in enabled: \(.external_email_enabled)",
            "auto-confirm new emails: \(.mailer_autoconfirm)",
            "code length: \(.mailer_otp_length), code lifetime: \(.mailer_otp_exp)s",
            "custom SMTP host: \(.smtp_host // "none (Supabase built-in)")",
            "sender: \(.smtp_sender_name // "?") <\(.smtp_admin_email // "?")>",
            "sign-in emails per hour: \(.rate_limit_email_sent)"' cfg.json | sed 's/^/::notice title=auth-config::/'
          for t in confirmation magic_link email_change reauthentication recovery invite; do
            jq -r --arg t "$t" '
              (.["mailer_subjects_" + $t] // "") as $s | (.["mailer_templates_" + $t + "_content"] // "") as $b |
              "\($t): subject=\(if $s == "" then "(Supabase default)" else $s end) | body=\(if $b == "" then "(Supabase default)" else "\($b | length) chars" end) | has code {{ .Token }}: \($b | test("\\.Token\\b")) | has link {{ .ConfirmationURL }}: \($b | test("ConfirmationURL"))"' cfg.json \
              | sed 's/^/::notice title=template::/'
          done
          rm -f cfg.json
