name: Apps (typecheck + web build)

on:
  push:
    paths: ["platform/apps/**", "platform/packages/**", "platform/package.json", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["platform/apps/**", "platform/packages/**", "platform/package.json", ".github/workflows/apps.yml"]

jobs:
  apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck shared
        run: npm run typecheck -w @crew/shared
      - name: Shared tests
        run: npm test -w @crew/shared
      - name: Messaging dispatcher tests + typecheck
        run: |
          set -o pipefail
          npm test -w @crew/messaging 2>&1 | tee /tmp/mt.txt || { grep -E "not ok|Error" /tmp/mt.txt | head -20 | sed 's/^/::error title=messages-unit::/'; exit 1; }
          npm run typecheck -w @crew/messaging 2>&1 | tee /tmp/mtc.txt || { grep "error TS" /tmp/mtc.txt | head -20 | sed 's/^/::error title=messages-tsc::/'; exit 1; }
      - name: Weather worker tests + typecheck
        run: |
          set -o pipefail
          npm test -w @crew/weather 2>&1 | tee /tmp/wt.txt || { grep -E "not ok|Error" /tmp/wt.txt | head -20 | sed 's/^/::error title=weather-unit::/'; exit 1; }
          npm run typecheck -w @crew/weather 2>&1 | tee /tmp/wtc.txt || { grep "error TS" /tmp/wtc.txt | head -20 | sed 's/^/::error title=weather-tsc::/'; exit 1; }
      - name: Typecheck mobile
        run: |
          set -o pipefail
          npm run typecheck -w @crew/mobile 2>&1 | tee /tmp/tc.txt || { grep "error TS" /tmp/tc.txt | head -25 | sed 's/^/::error title=mobile-tsc::/'; exit 1; }
      - name: Expo dependency check
        working-directory: platform/apps/mobile
        run: |
          set -o pipefail
          if ! npx expo install --check 2>&1 | tee /tmp/expo-check.txt; then
            npx expo install --fix > /dev/null 2>&1 || true
            node -e "const d=require('./package.json');console.log(JSON.stringify({...d.dependencies,...d.devDependencies}))" | sed 's/^/::error title=expo-fixed-versions::/'
            grep -v '^$' /tmp/expo-check.txt | head -20 | sed 's/^/::error title=expo-check::/'
            exit 1
          fi
      - name: Build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          npm run build -w @crew/web 2>&1 | tee /tmp/build.txt || { grep -iE "error|failed|Type " /tmp/build.txt | head -25 | sed 's/^/::error title=web-build::/'; exit 1; }
      - name: Typecheck web
        run: npm run typecheck -w @crew/web
