name: Staging read-only check

# READ-ONLY inspection of crew-clock-staging (STAGING_DB_URL only; the guard
# refuses anything else, production included). Every query runs in a
# read-only transaction, so Postgres itself rejects any write. Prints counts
# and names of test companies, never emails or secrets.
on:
  workflow_dispatch:
  push:
    branches: [production-ops]
    paths: [".github/workflows/staging-readonly-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.STAGING_DB_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on"
    steps:
      - uses: actions/checkout@v5
      - name: Install psql 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Guard (must be crew-clock-staging)
        run: bash .github/scripts/require-staging.sh
      - name: Database and migrations
        run: |
          q() { psql "$DB_URL" -X -At -F '|' -c "begin transaction read only; $1; rollback;" | grep -v -e '^BEGIN$' -e '^ROLLBACK$'; }
          echo "::notice title=read-only::session read-only = $(q "show transaction_read_only")"
          echo "::notice title=database::$(q "select split_part(version(), ' on ', 1)") | size $(q "select pg_size_pretty(pg_database_size(current_database()))")"
          q "select version, case when statements[1] like 'md5:%' then substring(statements[1] from 5) else 'no-fingerprint' end from supabase_migrations.schema_migrations order by 1" > db.txt
          missing=""; changed=""; n=0
          for f in $(ls platform/supabase/migrations/*.sql | sort); do
            n=$((n+1)); v=$(basename "$f" | cut -d_ -f1); sum=$(md5sum "$f" | cut -d' ' -f1)
            row=$(grep "^$v|" db.txt || true)
            if [ -z "$row" ]; then missing="$missing $v"; elif [ "${row#*|}" != "$sum" ]; then changed="$changed $v"; fi
          done
          extra=$(cut -d'|' -f1 db.txt | while read v; do ls platform/supabase/migrations/${v}_*.sql >/dev/null 2>&1 || echo -n "$v "; done)
          echo "::notice title=history::$(q "select count(*) || ' recorded; ' || count(*) filter (where statements[1] like 'md5:%') || ' with fingerprint; without: ' || coalesce(string_agg(version || ' (' || coalesce(name,'') || ')', ', ') filter (where statements[1] not like 'md5:%' or statements is null), 'none') from supabase_migrations.schema_migrations")"
          echo "::notice title=migrations::repo has $n, staging has $(wc -l < db.txt), newest on staging $(tail -1 db.txt | cut -d'|' -f1); missing:${missing:- none}; fingerprint differs:${changed:- none}; on staging but not in repo: ${extra:-none}"
          echo "::notice title=flags::$(q "select string_agg(key||'='||enabled, ', ' order by key) from private.platform_flags") (production must be false here)"
      - name: Existing test data
        run: |
          q() { psql "$DB_URL" -X -At -F '|' -c "begin transaction read only; $1; rollback;" | grep -v -e '^BEGIN$' -e '^ROLLBACK$'; }
          echo "::notice title=companies::$(q "select count(*) || ' — ' || coalesce(string_agg(name, '; ' order by created_at), 'none') from public.tenants")"
          echo "::notice title=sign-ins::$(q "select count(*) || ' accounts (' || count(*) filter (where email_confirmed_at is not null) || ' confirmed), last sign-in ' || coalesce(max(last_sign_in_at)::date::text, 'never') from auth.users"), sessions $(q "select count(*) from auth.sessions")"
          rows=$(q "select string_agg(t || '=' || n, ', ' order by t) from (select c.relname t, (xpath('/row/c/text()', query_to_xml(format('select count(*) c from public.%I', c.relname), false, true, '')))[1]::text::int n from pg_class c join pg_namespace s on s.oid=c.relnamespace where s.nspname='public' and c.relkind='r') x where n > 0")
          echo "::notice title=rows::non-empty tables: ${rows:-none}"
          echo "::notice title=messages::$(q "select count(*) || ' messages; live: ' || count(*) filter (where mode='live') from public.messages")"
          echo "::notice title=storage::$(q "select count(*) || ' stored files' from storage.objects")"
      - name: Tenant isolation (read-only probes as real staging users)
        run: |
          q() { psql "$DB_URL" -X -At -F '|' -c "begin transaction read only; $1; rollback;" | grep -v -e '^BEGIN$' -e '^ROLLBACK$'; }
          echo "::notice title=posture::row security off on: $(q "select coalesce(string_agg(c.relname, ', '), 'none') from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity"); anon grants: $(q "select coalesce(string_agg(table_name || ':' || privilege_type, ', '), 'none') from information_schema.role_table_grants where grantee='anon' and table_schema='public'")"
          tables=$(q "select string_agg(c.relname, ' ' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace join pg_attribute a on a.attrelid = c.oid and a.attname = 'tenant_id' and not a.attisdropped where n.nspname = 'public' and c.relkind = 'r' and has_table_privilege('authenticated', c.oid, 'select')")
          ntables=$(echo $tables | wc -w)
          [ "$ntables" -gt 10 ] || { echo "::error title=isolation::found only $ntables company tables to probe; refusing to report a pass"; exit 1; }
          users=$(q "select u.id || ':' || coalesce(string_agg(m.tenant_id::text, ','), '') from auth.users u left join public.memberships m on m.user_id = u.id group by u.id")
          probed=0; leaks=0; detail=""
          for row in $users; do
            uid=${row%%:*}; ten=${row#*:}
            arr="array[$(echo "$ten" | sed "s/[^,][^,]*/'&'::uuid/g")]::uuid[]"; [ -z "$ten" ] && arr="array[]::uuid[]"
            sel=""; for t in $tables; do sel="$sel union all select '$t', count(*) from public.$t where not (tenant_id = any($arr))"; done
            out=$(psql "$DB_URL" -X -At -F '|' -v ON_ERROR_STOP=1 <<SQL 2>&1
          begin transaction read only;
          select set_config('request.jwt.claims', '{"sub":"$uid","role":"authenticated"}', true);
          set local role authenticated;
          select t, n from (select '' t, 0::bigint n where false $sel) x where n > 0;
          rollback;
          SQL
            ) || { echo "::error title=isolation::probe failed: $(echo "$out" | tail -2 | tr '\n' ' ')"; exit 1; }
            bad=$(echo "$out" | grep '|' || true)
            [ -n "$(echo "$out" | grep -i error)" ] && { echo "::error title=isolation::$(echo "$out" | grep -i error | head -1)"; exit 1; }
            probed=$((probed+1)); if [ -n "$bad" ]; then leaks=$((leaks+1)); detail="$detail [user $probed: $(echo $bad)]"; fi
          done
          anon=$(psql "$DB_URL" -X -At -c "begin transaction read only; set local role anon; select count(*) from information_schema.table_privileges where grantee in ('anon','PUBLIC') and table_schema='public' and privilege_type='SELECT'; rollback;" | grep -v -e BEGIN -e ROLLBACK -e SET)
          [ "$probed" -gt 0 ] || { echo "::notice title=isolation::NOT PROBED — staging has no accounts yet ($ntables company tables found, row security on all). Live probe possible once test accounts exist."; exit 0; }
          if [ "$leaks" = 0 ]; then
            echo "::notice title=isolation::PASS — $probed staging accounts each probed against $ntables company tables: none can see another company's rows; anonymous select grants: $anon"
          else
            echo "::error title=isolation::LEAK for $leaks of $probed accounts:$detail"; exit 1
          fi
